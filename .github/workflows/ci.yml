name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff · mypy · pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --python ${{ matrix.python }} --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      - name: Pytest (offline)
        run: uv run pytest
      - name: Doctor (offline)
        run: uv run topoli doctor --skip-network

  report-quality:
    name: report · Lighthouse ≥ 90
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: uv sync --frozen
      - name: Build the golden example report offline
        run: uv run python scripts/build_report_offline.py zurich-badenerstrasse-171 "Badenerstrasse 171, 8003 Zürich" ./ci-reports --lang de
      - name: Serve and run Lighthouse (mobile, best of 3)
        run: |
          cd ci-reports/zurich-AU6979
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:8765/index.html \
              --only-categories=performance,accessibility,best-practices \
              --output=json --output-path=../lighthouse-$i.json \
              --chrome-flags="--headless=new --no-sandbox" --quiet --form-factor=mobile
          done
      - name: Check thresholds (best of 3 — CI runners are noisy)
        run: uv run python scripts/lighthouse_check.py ci-reports/lighthouse-1.json ci-reports/lighthouse-2.json ci-reports/lighthouse-3.json
      - name: Upload report and Lighthouse result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: ci-reports
