name: Nightly source contracts

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live source-contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Run live contract tests
        id: live
        continue-on-error: true
        run: uv run pytest tests/source-contracts -m live -o addopts="" -q --junitxml=tests/source-contracts/junit.xml
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-contracts-${{ github.run_id }}
          path: |
            tests/source-contracts/last_run.json
            tests/source-contracts/junit.xml
          if-no-files-found: ignore
      - name: Open or update the source-degraded issue
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "source-degraded: nightly source-contract run failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly live source-contract run failed on ${new Date().toISOString().slice(0, 10)}.`,
              "",
              `Run: ${runUrl}`,
              "",
              "Per-adapter details are in the `last_run.json` artifact (WO-04 splits this into one issue per adapter).",
            ].join("\n");
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "source-degraded", per_page: 50,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["source-degraded"],
              });
            }
      - name: Fail the job if contracts failed
        if: steps.live.outcome == 'failure'
        run: exit 1
