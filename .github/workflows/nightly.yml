name: Nightly source contracts

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    name: Live source-contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Run live contract tests
        id: live
        continue-on-error: true
        run: uv run pytest tests/source-contracts -m live -o addopts="" -q --junitxml=tests/source-contracts/junit.xml
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-contracts-${{ github.run_id }}
          path: |
            tests/source-contracts/last_run.json
            tests/source-contracts/junit.xml
          if-no-files-found: ignore
      - name: Open or update one source-degraded issue per adapter
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let degraded = [];
            let adapters = {};
            try {
              const data = JSON.parse(fs.readFileSync("tests/source-contracts/last_run.json", "utf8"));
              degraded = data.degraded || [];
              adapters = data.adapters || {};
            } catch (e) {
              degraded = ["(unknown — last_run.json missing)"];
            }
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "source-degraded", per_page: 100,
            });
            for (const adapter of degraded) {
              const title = `source-degraded: ${adapter}`;
              const failed = (adapters[adapter] && adapters[adapter].failed) || [];
              const body = [
                `The nightly live source-contract run failed for \`${adapter}\` on ${new Date().toISOString().slice(0, 10)}.`,
                "",
                `Run: ${runUrl}`,
                "",
                failed.length ? "Failed tests:\n" + failed.map((t) => `- \`${t}\``).join("\n") : "",
                "",
                "The coverage bar for this adapter shows *degraded* until this is fixed and the issue closed.",
              ].join("\n");
              const existing = open.find((i) => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["source-degraded"],
                });
              }
            }
      - name: Fail the job if contracts failed
        if: steps.live.outcome == 'failure'
        run: exit 1
