[project]
name = "topoli"
version = "0.1.0.dev0"
description = "Open-source construction intelligence for AI agents. Give your agent an address; it returns sourced findings about what you can build there."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noémie Rakotomalala" }]
keywords = ["switzerland", "open-data", "claude-skill", "ai-agents", "proptech", "construction", "geospatial"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "pillow>=12.3.0",
  "pypdf>=6.18.0",
  "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/suchipizza/Topoli"
Repository = "https://github.com/suchipizza/Topoli"
Issues = "https://github.com/suchipizza/Topoli/issues"

[project.scripts]
topoli = "topoli.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-shapely>=2.1.0.20260728",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topoli"]
# Repo-root assets the installed package needs at runtime (resolved via topoli.paths).
# Packaged copies of the repo-root assets live in a sibling directory (never inside the
# ``topoli`` package: an editable install would otherwise create a shadowing namespace package).
[tool.hatch.build.targets.wheel.force-include]
"i18n" = "topoli_data/i18n"
"ui" = "topoli_data/ui"
"skills" = "topoli_data/skills"

[tool.hatch.build.targets.sdist]
include = ["topoli", "skills", "ui", "i18n", "tests", "docs", "README*.md", "LICENSE", "LICENCES.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PL", "T20"]
ignore = ["PLR0913", "PLR2004", "T201", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR", "S", "PLC0415"]
"topoli/cli.py" = ["PLC0415"]
# Lazy imports break the registry ↔ country-package import cycle on purpose.
"topoli/core/adapters/registry.py" = ["PLC0415"]
"topoli/core/adapters/fixtures.py" = ["PLC0415"]
"topoli/core/scoring/coverage.py" = ["PLC0415"]
"topoli/core/adapters/http.py" = ["PLC0415"]
"topoli/countries/**/__init__.py" = ["PLC0415"]
"topoli/countries/ch/federal/licences.py" = ["E501"]
"topoli/countries/ch/zh/licences.py" = ["E501"]
"topoli/countries/ch/zh/regulation/generate.py" = ["PLC0415"]
"skills/**/scripts/**" = ["T20", "PLC0415", "PLR0912", "PLR0915"]
"scripts/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unreachable = true
files = ["topoli", "tests", "skills", "scripts"]
exclude = ["^examples/", "^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
markers = [
  "live: hits real external endpoints (nightly source-contract tests; deselected by default)",
  "todo: intentionally failing until a later work order fills the data (deselected with -k 'not todo')",
]
filterwarnings = ["error::DeprecationWarning:topoli.*"]
